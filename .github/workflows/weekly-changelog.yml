name: Weekly Changelog Draft

on:
  schedule:
    - cron: '0 8 * * 5'  # Every Friday at 8am UTC
  workflow_dispatch:

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed

      - name: Generate changelog with Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are a technical writer. Generate a changelog draft for this week's work.

            Steps:
            1. Run `gh pr list --repo $GITHUB_REPOSITORY --state merged --limit 50 --json number,title,mergedAt,body,labels` and filter for PRs merged in the last 7 days
            2. Run `git log --since="7 days ago" --oneline --no-merges` for direct commits
            3. Categorize changes into sections:
               - 🚀 Features
               - 🐛 Bug Fixes
               - ⚡ Performance
               - 🔧 Maintenance / Chores
               - 📝 Docs
            4. Write a clean, user-facing changelog draft in Keep a Changelog format
            5. Create a GitHub issue:
               - Title: "Changelog Draft — Week of $(date +'%Y-%m-%d')"
               - Label: "changelog" (create if missing)
               - Body: the full changelog markdown

            Skip the week if there are no merged PRs and no commits.
