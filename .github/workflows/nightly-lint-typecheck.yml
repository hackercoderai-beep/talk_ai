name: Nightly Lint & Type Check

on:
  schedule:
    - cron: '0 2 * * *'  # Every night at 2am UTC
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run checks and report with Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are a code quality assistant. Run lint and type checks on this TypeScript project and report issues.

            Steps:
            1. Run `npx tsc --noEmit 2>&1` and capture output
            2. Run `npx eslint . --ext .ts,.tsx --format json 2>&1` and capture output
            3. Analyze the results:
               - Count errors vs warnings
               - Group errors by file and type
               - Identify any regressions (new errors not seen before)
            4. If there are errors:
               - Search for any existing open issue titled "Nightly Lint/Type Report" and close it first
               - Create a new GitHub issue:
                 - Title: "Nightly Lint/Type Report — $(date +'%Y-%m-%d')"
                 - Label: "tech-debt" (create if missing)
                 - Body: structured breakdown of all errors with file:line references
            5. If clean (zero errors): do nothing, no issue needed.

            Use `gh issue create --repo $GITHUB_REPOSITORY` for issue creation.
